<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拾光任务 · 老黄历 · 泳道时间线</title>
<style>
/* ============ 基础结构样式 ============ */
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{ font-family:inherit; cursor:pointer; }
textarea, input, select{ font-family:inherit; }
:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; border-radius:6px; }
svg{ display:block; }

/* ---- 顶栏 ---- */
.app-header{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:12px 22px;
  background:var(--header-bg);
  border-bottom:2px solid var(--primary);
  position:sticky; top:0; z-index:40;
  flex-wrap:wrap;
}
.brand{ display:flex; align-items:center; gap:10px; }
.brand .logo{
  width:38px; height:38px; border-radius:10px;
  background:var(--primary); color:var(--on-primary);
  display:flex; align-items:center; justify-content:center; flex:none;
  transform:rotate(-3deg);
}
.brand h1{ font-family:var(--font-head); font-size:19px; letter-spacing:2px; }
.brand p{ font-size:11.5px; color:var(--text-faint); }
.header-mid{ display:flex; gap:6px; flex-wrap:wrap; }
.nav-tab{
  border:1px solid transparent; background:transparent; color:var(--text-soft);
  padding:7px 16px; border-radius:6px; font-size:13.5px; font-weight:600;
  font-family:var(--font-head);
  transition:all .18s ease;
}
.nav-tab:hover{ background:var(--surface-2); color:var(--text); }
.nav-tab.active{ background:var(--primary); color:var(--on-primary); }
.header-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.progress-chip{
  font-size:12.5px; font-weight:600; color:var(--accent);
  background:var(--accent-soft); border:1px solid var(--border-strong);
  border-radius:999px; padding:6px 14px;
}
.btn{
  display:inline-flex; align-items:center; gap:6px;
  border:1px solid var(--border-strong); background:var(--surface); color:var(--text);
  border-radius:6px; padding:7px 14px; font-size:13px; font-weight:600;
  font-family:var(--font-head);
  transition:all .18s ease;
}
.btn:hover{ background:var(--surface-2); }
.btn.primary{ background:var(--primary); border-color:var(--primary); color:var(--on-primary); }
.btn.primary:hover{ opacity:.9; }
.btn.danger{ background:var(--danger); border-color:var(--danger); color:#fff; }
.btn.danger:hover{ opacity:.9; }
.icon-btn{
  width:34px; height:34px; border-radius:6px;
  border:1px solid var(--border-strong); background:var(--surface);
  color:var(--text-soft); display:flex; align-items:center; justify-content:center;
  transition:all .18s ease;
}
.icon-btn:hover{ background:var(--primary); border-color:var(--primary); color:var(--on-primary); }

/* ---- 主容器 ---- */
main{ max-width:1200px; margin:0 auto; padding:16px 22px 92px; }
.view{ display:none; }
.view.active{ display:block; animation:viewIn .22s ease; }
@keyframes viewIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none;} }

/* ---- 日历 ---- */
.cal-toolbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
.month-nav{ display:flex; align-items:center; gap:6px; }
.month-title{ font-family:var(--font-head); font-size:22px; min-width:118px; text-align:center; letter-spacing:2px; }
.month-sub{ font-size:12px; color:var(--text-faint); text-align:center; letter-spacing:1px; }
.cal-grid{
  display:grid; grid-template-columns:repeat(7,1fr); gap:8px;
  border:1px solid var(--border-strong); border-radius:var(--radius);
  padding:10px; background:var(--surface);
}
.week-head{
  text-align:center; font-size:12.5px; font-weight:700; color:#8A7B55;
  padding:4px 0 2px; font-family:var(--font-head);
}
.cell{
  min-height:96px; border:1px solid var(--border); border-radius:4px;
  background:#FDF8EA; padding:6px; cursor:pointer; position:relative;
  display:flex; flex-direction:column; gap:3px; overflow:hidden;
  transition:all .18s ease;
}
.cell:hover{ border-color:var(--primary); box-shadow:var(--shadow); }
.cell.other{ opacity:.55; background:var(--surface-2); }
.cell.today{ background:#F6E4DC; border-color:var(--primary); border-width:2px; }
.cell-top{ display:flex; align-items:baseline; gap:6px; }
.cell .dnum{ font-family:var(--font-head); font-size:16px; font-weight:700; }
.cell.today .dnum{
  background:var(--primary); color:var(--on-primary);
  width:22px; height:22px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
}
.cell .lunar{ font-size:10px; color:var(--text-faint); }
.cell .yj{ font-size:9.5px; display:flex; gap:6px; letter-spacing:1px; }
.cell .yj .yi{ color:var(--yi); }
.cell .yj .ji{ color:var(--ji); }
.cell-tasks{ display:flex; flex-direction:column; gap:3px; margin-top:auto; }
.chip{
  font-size:11px; font-weight:600; color:#fff; border-radius:3px;
  padding:1px 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  font-family:var(--font-head);
}
.chip.p-urgent{ background:var(--urgent); }
.chip.p-important{ background:var(--important); }
.chip.p-normal{ background:var(--normal); }
.chip.done{ opacity:.42; text-decoration:line-through; }
.chip.more{ background:var(--surface-2); color:var(--text-soft); }

/* ---- 侧边栏 ---- */
.side-mask{ position:fixed; inset:0; background:rgba(20,16,10,.35); z-index:55; }
.side-mask[hidden]{ display:none; }
.side-panel{
  position:fixed; top:0; right:0; height:100dvh; width:392px; max-width:92vw;
  background:var(--surface); border-left:2px solid var(--primary);
  transform:translateX(105%); transition:transform .26s ease;
  display:flex; flex-direction:column; z-index:60; box-shadow:-8px 0 24px rgba(60,40,10,.2);
}
.side-panel.open{ transform:translateX(0); }
.side-head{
  display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
  padding:16px 18px 12px; border-bottom:2px solid var(--primary);
}
.side-head h3{ font-family:var(--font-head); font-size:17px; letter-spacing:1px; }
.side-head .side-lunar{ font-size:12px; color:var(--text-soft); margin-top:2px; letter-spacing:1px; }
.side-body{ flex:1; overflow-y:auto; padding:12px 16px; }
.side-list{ list-style:none; display:flex; flex-direction:column; gap:8px; }
.side-item{
  display:flex; align-items:center; gap:10px; padding:9px 10px;
  border:1px solid var(--border); border-radius:4px; background:#FDF8EA;
}
.side-item.done{ opacity:.55; }
.side-item .s-main{ flex:1; min-width:0; }
.side-item .s-title{ font-weight:600; font-size:13.5px; font-family:var(--font-head); }
.side-item.done .s-title{ text-decoration:line-through; color:var(--text-faint); }
.side-item .s-meta{ font-size:11px; color:var(--text-faint); margin-top:2px; }
.side-foot{ padding:12px 16px 18px; border-top:1px solid var(--border); }
.side-foot .btn{ width:100%; justify-content:center; padding:11px; }

/* ---- 当天页 ---- */
.day-topbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
.day-nav{ display:flex; gap:6px; }
.day-clock{ font-family:var(--font-head); font-size:26px; font-weight:700; color:var(--primary); letter-spacing:1px; }
.day-head-card{
  background:var(--surface); border:1px solid var(--border); border-top:3px solid var(--primary);
  border-radius:var(--radius); padding:12px 18px; margin-bottom:12px;
  display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
}
.day-head-card h2{ font-family:var(--font-head); font-size:20px; letter-spacing:1px; }
.day-lunar{ font-size:13px; color:var(--text-soft); margin-top:3px; letter-spacing:1px; }
.day-progress{ font-size:12.5px; color:var(--accent); margin-top:3px; font-weight:600; }
.day-list-title{ font-family:var(--font-head); font-size:14px; color:var(--primary); margin:4px 0 8px; letter-spacing:1px; }
.day-list{ list-style:none; display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
.day-item{
  display:flex; align-items:center; gap:10px; padding:9px 12px;
  border:1px solid var(--border); border-radius:4px; background:#FDF8EA;
}
.day-item:hover{ border-color:var(--primary); }
.day-item.done{ opacity:.5; }
.day-item .p-bar{ width:4px; align-self:stretch; border-radius:2px; background:var(--normal); flex:none; }
.day-item .p-bar.urgent{ background:var(--urgent); }
.day-item .p-bar.important{ background:var(--important); }
.day-item .p-bar.normal{ background:var(--normal); }
.day-item .d-main{ flex:1; min-width:0; }
.day-item .d-title{ font-weight:600; font-size:13.5px; font-family:var(--font-head); }
.day-item.done .d-title{ text-decoration:line-through; color:var(--text-faint); }
.day-item .d-meta{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:11.5px; color:var(--text-soft); margin-top:2px; }
.mini{
  width:24px; height:24px; flex:none; border:none; border-radius:5px;
  background:transparent; color:var(--text-faint);
  display:flex; align-items:center; justify-content:center;
  transition:all .15s ease;
}
.mini svg{ width:13px; height:13px; }
.mini:hover{ background:var(--surface-2); color:var(--primary); }
.mini.del:hover{ color:var(--danger); }
.mini.chk.on{ background:var(--accent); color:#fff; }
.mini.chk.on svg{ color:#fff; }
.tl-title{ font-family:var(--font-head); font-size:14px; color:var(--primary); margin:2px 0 8px; letter-spacing:1px; }
#timelineArea{ margin-bottom:14px; }
.empty-tip{
  border:1px dashed var(--border-strong); border-radius:var(--radius); color:var(--text-faint);
  text-align:center; padding:26px 14px; font-size:13px; background:var(--surface);
}
.day-summary{
  background:var(--surface); border:1px solid var(--border); border-top:3px solid var(--primary);
  border-radius:var(--radius); padding:14px 18px; margin-top:4px;
}
.day-summary h3{ font-family:var(--font-head); font-size:15px; margin-bottom:8px; }
.day-summary textarea{
  width:100%; min-height:84px; border:1px solid var(--border); border-radius:6px;
  padding:10px 12px; font-size:13.5px; background:var(--surface-2); color:var(--text);
  resize:vertical; font-family:var(--font-body);
}
.day-summary textarea:focus{ outline:none; border-color:var(--primary); }
.summary-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
.summary-foot span{ font-size:12px; color:var(--text-faint); }

/* ---- 任务清单 ---- */
.tasks-toolbar{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
.filter-group{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.f-label{ font-size:12.5px; color:var(--text-faint); font-weight:600; }
.f-chip{
  border:1px solid var(--border-strong); background:var(--surface); color:var(--text-soft);
  border-radius:999px; padding:5px 14px; font-size:12.5px; font-weight:600;
  transition:all .18s ease;
}
.f-chip:hover{ border-color:var(--primary); color:var(--primary); }
.f-chip.on{ background:var(--primary); border-color:var(--primary); color:var(--on-primary); }
.task-list{ list-style:none; display:flex; flex-direction:column; gap:10px; }
.t-item{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.t-row{ display:flex; align-items:center; gap:10px; padding:10px 12px; cursor:pointer; }
.t-row:hover{ background:var(--surface-2); }
.p-bar{ width:4px; align-self:stretch; border-radius:2px; background:var(--normal); flex:none; }
.p-bar.urgent{ background:var(--urgent); }
.p-bar.important{ background:var(--important); }
.p-bar.normal{ background:var(--normal); }
.t-body{ flex:1; min-width:0; }
.t-title{ font-weight:700; font-size:14.5px; word-break:break-all; font-family:var(--font-head); }
.t-title.done{ text-decoration:line-through; color:var(--text-faint); }
.t-meta{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12px; color:var(--text-soft); margin-top:3px; }
.t-meta .done-n{ color:var(--accent); font-weight:600; }
.badge{ font-size:11px; font-weight:700; color:#fff; border-radius:4px; padding:1px 7px; font-family:var(--font-head); }
.badge.b-once{ background:var(--normal); }
.badge.b-fixed{ background:var(--accent); }
.badge.b-long{ background:var(--important); }
.badge.bp.urgent{ background:var(--urgent); }
.badge.bp.important{ background:var(--important); }
.badge.bp.normal{ background:var(--normal); }
.t-detail{ display:none; padding:2px 14px 12px 26px; font-size:12.5px; color:var(--text-soft); border-top:1px dashed var(--border); }
.t-item.open .t-detail{ display:block; }
.t-detail .det-note{ margin-top:8px; }
.t-detail .det-rec{ margin-top:6px; }
.t-detail .rec{ margin:3px 0 0 10px; }
.t-detail .faint{ color:var(--text-faint); }

/* ---- 每日总结汇总 ---- */
.notes-toolbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
.notes-stats{ font-size:12.5px; color:var(--text-soft); }
.week-group{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 16px; margin-bottom:12px; }
.week-title{ font-family:var(--font-head); font-size:14.5px; color:var(--primary); border-bottom:1px solid var(--border-strong); padding-bottom:6px; margin-bottom:4px; letter-spacing:1px; }
.note-day{ display:flex; gap:14px; padding:9px 4px; border-bottom:1px dashed var(--border); cursor:pointer; align-items:flex-start; }
.note-day:hover{ background:var(--surface-2); }
.note-day .nd-date{ min-width:120px; font-weight:600; font-size:13px; }
.note-day .nd-txt{ flex:1; font-size:13px; color:var(--text); white-space:pre-wrap; }
.note-day.empty .nd-txt{ color:var(--text-faint); font-style:italic; }

/* ---- 弹窗 ---- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(20,16,10,.45); z-index:100;
  display:flex; align-items:center; justify-content:center; padding:18px;
}
.modal-backdrop[hidden]{ display:none; }
.modal{
  background:var(--surface); border-radius:var(--radius); border-top:4px solid var(--primary);
  width:480px; max-width:100%; max-height:88vh; overflow-y:auto;
  padding:20px 22px 18px; box-shadow:var(--shadow);
}
.modal h2{ font-family:var(--font-head); font-size:17px; margin-bottom:2px; letter-spacing:1px; }
.modal .hint{ font-size:12.5px; color:var(--text-faint); margin-bottom:12px; }
.field{ margin-bottom:12px; }
.field label{ display:block; font-size:12.5px; font-weight:700; color:var(--text-soft); margin-bottom:5px; }
.field input[type="text"], .field input[type="date"], .field input[type="time"], .field input[type="number"], .field textarea{
  width:100%; border:1px solid var(--border-strong); border-radius:6px;
  padding:9px 12px; font-size:13.5px; background:var(--surface-2); color:var(--text);
}
.field textarea{ min-height:64px; resize:vertical; }
.field input:focus, .field textarea:focus{ outline:none; border-color:var(--primary); }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.type-tabs{ display:flex; gap:8px; margin-bottom:14px; }
.type-tab{
  flex:1; border:1px solid var(--border-strong); background:var(--surface-2);
  border-radius:6px; padding:9px 6px; font-size:13px; font-weight:700;
  color:var(--text-soft); font-family:var(--font-head); transition:all .18s ease;
}
.type-tab.on{ background:var(--primary); border-color:var(--primary); color:var(--on-primary); }
.prio-row{ display:flex; gap:8px; margin-bottom:14px; }
.prio-btn{
  flex:1; border:1px solid var(--border-strong); background:var(--surface-2);
  border-radius:6px; padding:8px 6px; font-size:13px; font-weight:700;
  color:var(--text-soft); font-family:var(--font-head); transition:all .18s ease;
}
.prio-btn:hover{ border-color:var(--primary); color:var(--primary); }
.prio-btn.on.urgent{ background:var(--urgent); border-color:var(--urgent); color:#fff; }
.prio-btn.on.important{ background:var(--important); border-color:var(--important); color:#fff; }
.prio-btn.on.normal{ background:var(--normal); border-color:var(--normal); color:#fff; }
.mode-row{ display:flex; gap:14px; font-size:13px; color:var(--text); margin-bottom:8px; }
.mode-row label{ display:flex; align-items:center; gap:6px; cursor:pointer; }
.freq-all{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text); margin-bottom:8px; cursor:pointer; }
.freq-days{ display:flex; gap:6px; flex-wrap:wrap; }
.freq-day{
  width:34px; height:34px; border-radius:6px; border:1px solid var(--border-strong);
  background:var(--surface-2); font-size:13px; font-weight:700; color:var(--text-soft);
  transition:all .18s ease;
}
.freq-day:hover{ border-color:var(--primary); color:var(--primary); }
.freq-day.on{ background:var(--primary); border-color:var(--primary); color:var(--on-primary); }
.freq-day:disabled{ opacity:.38; cursor:not-allowed; }
.form-error{ background:var(--danger-soft); color:var(--danger); border:1px solid var(--danger); border-radius:6px; padding:8px 12px; font-size:12.5px; margin-bottom:12px; }
.form-error[hidden]{ display:none; }
.modal-actions{ display:flex; gap:10px; margin-top:6px; }
.modal-actions .btn{ flex:1; justify-content:center; padding:11px; }
.confirm-msg{ font-size:13.5px; color:var(--text); line-height:1.6; margin-bottom:16px; }

/* ---- 底部弹幕舞台 ---- */
#danmakuStage{
  position:fixed; left:0; right:0; bottom:0; height:64px; z-index:50;
  background:var(--stage-bg); border-top:2px solid var(--primary);
  overflow:hidden; pointer-events:none;
  background-image:repeating-linear-gradient(0deg, rgba(120,90,40,.05) 0 1px, transparent 1px 4px);
}
#stageInner{ position:relative; width:100%; height:100%; }
.danmaku{
  position:absolute; bottom:6px;
  font-family:var(--font-head); font-size:16px; font-weight:700; letter-spacing:.5px;
  white-space:nowrap; padding:5px 16px; border-radius:999px;
  background:var(--surface); border:1px solid var(--border-strong);
  box-shadow:var(--shadow);
  animation:danmaku-rise 3.2s ease-out forwards;
}
@keyframes danmaku-rise{
  0%  { opacity:0; transform:translateY(16px) scale(.7); }
  12% { opacity:1; transform:translateY(0) scale(1); }
  78% { opacity:1; }
  100%{ opacity:0; transform:translateY(-44px) scale(.95); }
}

/* ============ 皮肤：老黄历 ============ */
:root{
  --bg:#F2E8D0;
  --surface:#FBF4E3;
  --surface-2:#F1E7CE;
  --border:#CBB98A;
  --border-strong:#B9A26B;
  --text:#3B362C;
  --text-soft:#6E6350;
  --text-faint:#94876B;
  --primary:#A03028;
  --primary-soft:#EEDAD4;
  --on-primary:#FFF8EC;
  --accent:#2E7D5B;
  --accent-soft:#E2EFE7;
  --danger:#A03028;
  --danger-soft:#F6E3E0;
  --urgent:#B33A2E;
  --important:#C98A1B;
  --normal:#5E748C;
  --yi:#A03028;
  --ji:#6B6454;
  --radius:8px;
  --radius-sm:6px;
  --shadow:0 3px 10px rgba(90,70,30,.18);
  --font-head:'Kaiti SC','STKaiti','KaiTi','楷体','Noto Serif SC',serif;
  --font-body:'Songti SC','STSong','SimSun','Noto Serif SC',serif;
  --stage-bg:#EFE3C4;
  --header-bg:#F7EFDA;
}
body{
  background-image:repeating-linear-gradient(0deg, rgba(120,90,40,.035) 0 1px, transparent 1px 4px);
}

/* ============ 泳道式时间线 ============ */
.tl-scroll{ overflow-x:auto; background:var(--surface); border:1px solid var(--border); border-top:3px solid var(--primary); border-radius:var(--radius); }
.tl-canvas{ position:relative; }
.tl-hour-line{ position:absolute; top:0; bottom:0; border-left:1px dashed var(--border); }
.tl-hour-lab{ position:absolute; top:6px; font-size:10px; color:var(--text-faint); transform:translateX(-50%); font-family:var(--font-head); }
.tl-lane-row{ position:absolute; left:0; right:0; border-bottom:1px solid var(--border); pointer-events:none; }
.tl-now-line{ position:absolute; top:0; bottom:0; width:0; border-left:2px solid var(--urgent); z-index:6; }
.tl-now-line span{ position:absolute; top:2px; left:4px; background:var(--urgent); color:#fff; font-size:10px; padding:0 7px; border-radius:8px; font-family:var(--font-head); white-space:nowrap; }
.tl-task{
  position:absolute; background:#FDF8EA; border:1px solid var(--border-strong);
  border-left:4px solid var(--normal); border-radius:4px; padding:3px 7px;
  cursor:grab; user-select:none; touch-action:none; overflow:hidden;
  display:flex; flex-direction:column;
}
.tl-task.p-urgent{ border-left-color:var(--urgent); }

function leapMonth(y){ return lunarInfo[y-1900]&0xf; }
function leapDays(y){ return leapMonth(y)?((lunarInfo[y-1900]&0x10000)?30:29):0; }
function monthDays(y,m){ return (lunarInfo[y-1900]&(0x10000>>m))?30:29; }
function lYearDays(y){ var i,sum=348; for(i=0x8000;i>0x8;i>>=1) sum+=(lunarInfo[y-1900]&i)?1:0; return sum+leapDays(y); }
function solar2lunar(y,m,d){
  var base=new Date(1900,0,31), obj=new Date(y,m-1,d);
  var offset=Math.floor((obj-base)/86400000);
  var i,temp;
  for(i=1900;i<2101&&offset>0;i++){ temp=lYearDays(i); offset-=temp; }
  if(offset<0){ offset+=temp; i--; }
  var lunarYear=i;
  var leap=leapMonth(i), isLeap=false;
  for(i=1;i<13&&offset>0;i++){
    if(leap>0&&i===(leap+1)&&!isLeap){ --i; isLeap=true; temp=leapDays(lunarYear); }
    else{ temp=monthDays(lunarYear,i); }
    if(isLeap&&i===(leap+1)) isLeap=false;
    offset-=temp;
  }
  if(offset===0&&leap>0&&i===leap+1){ if(isLeap){ isLeap=false; } else { isLeap=true; --i; } }
  if(offset<0){ offset+=temp; --i; }
  return { lYear:lunarYear, lMonth:i, lDay:offset+1, isLeap:isLeap };
}
function jdn(y,m,d){ var a=Math.floor((14-m)/12), yy=y+4800-a, mm=m+12*a-3; return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045; }
var GAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
var ZHI=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
function ganzhiYear(y){ return GAN[(y-4)%10]+ZHI[(y-4)%12]; }
function ganzhiDay(y,m,d){ var n=(jdn(y,m,d)+49)%60; return GAN[n%10]+ZHI[n%12]; }
var LMONTHS=['正月','二月','三月','四月','五月','六月','七月','八月','九月','十月','冬月','腊月'];
var LDAYS=['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
function lunarTextOf(iso){ var p=iso.split('-').map(Number); var l=solar2lunar(p[0],p[1],p[2]); var m=(l.isLeap?'闰':'')+LMONTHS[l.lMonth-1]; return (l.lDay===1?m:LDAYS[l.lDay-1]); }
function ganzhiYearOf(iso){ var p=iso.split('-').map(Number); var l=solar2lunar(p[0],p[1],p[2]); return ganzhiYear(l.lYear); }
function ganzhiDayText(iso){ var p=iso.split('-').map(Number); return ganzhiDay(p[0],p[1],p[2]); }

/* ==================== 任务查询 ==================== */
function matchesRepeat(r,wd){ if(!r) return false; if(r.kind==='daily') return true; if(r.kind==='weekly') return r.days.indexOf(wd)!==-1; return false; }
function cmpTasks(a,b){
  var p=PRIO_RANK[a.priority]-PRIO_RANK[b.priority];
  if(p) return p;
  var ta=a.startTime||'99:99', tb=b.startTime||'99:99';
  return ta<tb?-1:(ta>tb?1:0);
}
function tasksForDate(iso){
  var wd=parseIso(iso).getDay();
  return state.tasks.filter(function(t){
    if(t.type==='once') return t.date===iso;
    if(t.type==='fixed'){ if(t.mode==='once') return t.date===iso; return matchesRepeat(t.repeat,wd); }
    if(t.type==='long') return matchesRepeat(t.repeat,wd);
    return false;
  }).sort(cmpTasks);
}
function repeatLabel(r){
  if(!r) return '';
  if(r.kind==='daily') return '每天';
  var ns=r.days.slice().sort(function(a,b){return a-b;}).map(function(d){return WEEKDAYS[d];});
  return '每周'+ns.join('、');
}
function taskMeta(t){
  var parts=[];
  if(t.type==='once'){ if(t.startTime) parts.push(t.endTime?t.startTime+'–'+t.endTime:t.startTime); else parts.push('全天'); }
  else if(t.type==='fixed'){ parts.push('时长 '+t.durationMin+' 分钟'); if(t.mode==='once'){ if(t.date) parts.push(fmtShort(t.date)); if(t.startTime) parts.push(t.startTime); } else { parts.push(repeatLabel(t.repeat)); if(t.startTime) parts.push(t.startTime); } }
  else { parts.push(repeatLabel(t.repeat)); if(t.startTime) parts.push(t.startTime); else parts.push('全天'); }
  return parts.join(' · ');
}
function anyCompleted(t){ for(var k in t.completed) return true; return false; }
function completedCount(t){ var c=0; for(var k in t.completed) c++; return c; }

function parseHash(){
  var h=location.hash||'#/calendar';
  var parts=h.replace(/^#\/?/,'').split('/');
  var name=parts[0]||'calendar';
  if(name==='day' && parts[1] && /^\d{4}-\d{2}-\d{2}$/.test(parts[1])){
    state.day=parts[1];
    return {name:'day'};
  }
  if(name==='day'){ location.hash='#/calendar'; return {name:'calendar'}; }
  if(['calendar','tasks','notes'].indexOf(name)<0) return {name:'calendar'};
  return {name:name};
}
function setView(name){
  var map={calendar:'viewCalendar',day:'viewDay',tasks:'viewTasks',notes:'viewNotes'};
  for(var k in map) $(map[k]).classList.toggle('active',k===name);
  var tabs=document.querySelectorAll('.nav-tab');
  tabs.forEach(function(t){ t.classList.toggle('active',t.dataset.route===name); });
}
function render(){
  renderHeader();
  var r=parseHash();
  setView(r.name);
  if(r.name==='calendar') renderCalendar();
  else if(r.name==='day') renderDay();
  else if(r.name==='tasks') renderTasks();
  else renderNotes();
  if(r.name==='calendar' && !$('sideMask').hidden && state.sideIso) renderSide();
}
function renderHeader(){
  var iso=todayIso();

function renderCalendar(){
  var y=state.year, m=state.month;
  var grid=$('calGrid'); grid.innerHTML='';
  ['一','二','三','四','五','六','日'].forEach(function(w){
    var h=document.createElement('div'); h.className='week-head'; h.textContent=w; grid.appendChild(h);
  });
  var first=new Date(y,m-1,1);
  var start=(first.getDay()+6)%7;
  var dim=new Date(y,m,0).getDate();
  var total=Math.ceil((start+dim)/7)*7;
  var today=todayIso();
  for(var i=0;i<total;i++){
    var dt=new Date(y,m-1,1-start+i);
    var iso=isoOf(dt.getFullYear(),dt.getMonth()+1,dt.getDate());
    var inMonth=dt.getMonth()===m-1;
    var cell=document.createElement('div');
    cell.className='cell'+(inMonth?'':' other');
    if(iso===today) cell.classList.add('today');
    cell.dataset.date=iso;
    cell.setAttribute('role','gridcell');
    cell.setAttribute('aria-label',fmtCN(iso));
    var top=document.createElement('div'); top.className='cell-top';
    var num=document.createElement('span'); num.className='dnum'; num.textContent=dt.getDate();
    if(iso===today) num.setAttribute('aria-current','date');
    top.appendChild(num);
    var lun=document.createElement('span'); lun.className='lunar'; lun.textContent=lunarTextOf(iso);
    top.appendChild(lun);
    cell.appendChild(top);
    var yj=yiJiOf(iso);
    var yjEl=document.createElement('div'); yjEl.className='yj';
    yjEl.innerHTML='<span class="yi">宜'+esc(yj.yi)+'</span><span class="ji">忌'+esc(yj.ji)+'</span>';
    cell.appendChild(yjEl);
    var tasks=tasksForDate(iso);
    var wrap=document.createElement('div'); wrap.className='cell-tasks';
    tasks.slice(0,3).forEach(function(t){
      var chip=document.createElement('span');
      chip.className='chip p-'+t.priority+(t.completed[iso]?' done':'');
      chip.textContent=t.title;
      chip.title=t.title;
      wrap.appendChild(chip);
    });
    if(tasks.length>3){
      var more=document.createElement('span'); more.className='chip more'; more.textContent='+'+(tasks.length-3);
      wrap.appendChild(more);
    }
    cell.appendChild(wrap);
    grid.appendChild(cell);
  }
  $('monthTitle').textContent=y+'年'+m+'月';
  $('monthSub').textContent='农历'+lunarTextOf(isoOf(y,m,1))+' · '+ganzhiYearOf(isoOf(y,m,1))+'年';
}

function renderNotes(){
  var y=state.notesYear, m=state.notesMonth;
  $('notesMonthTitle').textContent=y+'年'+m+'月';
  var dim=new Date(y,m,0).getDate();
  var written=0;
  var groups=[], cur=null, curKey='';
  for(var d=1;d<=dim;d++){
    var iso=isoOf(y,m,d);
    var wd=parseIso(iso).getDay();
    var monday=isoAdd(iso,-(wd+6)%7);
    if(curKey!==monday){ curKey=monday; cur={monday:monday,days:[]}; groups.push(cur); }
    if(state.notes[iso]) written++;
    cur.days.push(iso);
  }
  var wrap=$('notesGroups'); wrap.innerHTML='';
  groups.forEach(function(g){
    var sec=document.createElement('section'); sec.className='week-group';
    var h=document.createElement('h3'); h.className='week-title';
    h.textContent=fmtShort(g.monday)+' – '+fmtShort(isoAdd(g.monday,6));
    sec.appendChild(h);
    g.days.forEach(function(iso){

function saveTaskFromForm(){
  var title=$('fTitle').value.trim();
  if(!title){ showError('请填写任务名称'); return; }
  var t={id:uid(),title:title,type:currentType,priority:currentPriority,
         createdAt:new Date().toISOString(),completed:{}};
  var note=$('fNote').value.trim();
  if(note) t.note=note;

  if(currentType==='once'){
    var date=$('fOnceDate').value;
    if(!date){ showError('请选择日期'); return; }
    t.date=date;
    var s=$('fOnceStart').value, e=$('fOnceEnd').value;
    if(e&&s&&e<=s){ showError('结束时间必须晚于开始时间'); return; }
    if(s) t.startTime=s;
    if(e) t.endTime=e;
  } else if(currentType==='fixed'){
    var dur=parseInt($('fFixedDuration').value,10);
    if(!dur||dur<=0){ showError('请填写每次时长（分钟）'); return; }
    t.durationMin=dur; t.mode=currentFixedMode;
    if(currentFixedMode==='once'){
      var fdate=$('fFixedDate').value;
      if(!fdate){ showError('请选择日期'); return; }
      t.date=fdate;
      if($('fFixedStart').value) t.startTime=$('fFixedStart').value;
    } else {
      var r1=readFreq();
      if(!r1){ showError('请选择重复频率'); return; }
      t.repeat=r1;
      if($('fFixedRepeatStart').value) t.startTime=$('fFixedRepeatStart').value;
    }
  } else {
    var r2=readFreq();
    if(!r2){ showError('请选择重复频率'); return; }
    t.repeat=r2;
    if($('fLongStart').value) t.startTime=$('fLongStart').value;
  }

  if(editTaskId){
    var old=state.tasks.find(function(x){return x.id===editTaskId;});
    if(old){
      var keep={id:old.id,completed:old.completed,createdAt:old.createdAt,order:old.order,laneIdx:old.laneIdx};
      t=Object.assign(t,keep);
      state.tasks[state.tasks.indexOf(old)]=t;
    }
  } else {
    state.tasks.push(t);
  }
  saveTasks();
  render();
  closeTaskModal();
  spawnDanmaku(rand(QUOTES.add),cssVar('--primary'));
}

/* ==================== 泳道式时间线 ==================== */
var A_HOUR_W=90, A_LANE_H=64, A_TOP=36;

var renderTimeline=function(){
  var iso=state.day;
  var area=$('timelineArea'); area.innerHTML='';
  var all=tasksForDate(iso);
  if(!all.length){ area.innerHTML='<div class="empty-tip">今天还没有任务，点击右上角「添加当天任务」</div>'; return; }
  var timed=all.filter(function(t){return t.startTime;}).sort(byStartTime);
  var allDay=all.filter(function(t){return !t.startTime;});
  var W=24*A_HOUR_W;
  var html='';

  // 全天区：独立在时间轴上方，横向滚动时间轴时始终可见
  if(allDay.length){
    html+='<div class="tl-allday-box"><div class="tl-allday-title">全天 · 无固定时间</div><div class="tl-allday-items">';
    allDay.forEach(function(t){
      var done=!!t.completed[iso];
      html+='<div class="tl-allday-item p-'+t.priority+(done?' done':'')+'" data-id="'+t.id+'">'
        +'<span class="tag">全天</span>'
        +'<span class="name">'+esc(t.title)+'</span>'
        +'<button class="mini chk'+(done?' on':'')+'" data-act="chk" aria-label="完成任务">'+ICONS.check+'</button>'
        +'<button class="mini del" data-act="del" aria-label="删除任务">'+ICONS.trash+'</button>'
        +'</div>';
    });
    html+='</div></div>';
  }

  // 时间轴（仅定时任务，时间重叠的自动分层）
  if(timed.length){
    var lanes=[], placed=[];
    timed.forEach(function(t){
      var st=toMin(t.startTime), en=st+taskDur(t);
      var pref=(typeof t.laneIdx==='number')?t.laneIdx:0;
      if(pref<0)pref=0;
      var lane=pref;
      while(lanes[lane]&&lanes[lane].some(function(p){return !(en<=p.st||st>=p.en);})) lane++;
      if(!lanes[lane]) lanes[lane]=[];
      lanes[lane].push({st:st,en:en});
      placed.push({t:t,lane:lane,st:st,en:en});
    });
    var H=A_TOP+lanes.length*A_LANE_H+14;
    html+='<div class="tl-scroll"><div class="tl-canvas" style="width:'+W+'px;height:'+H+'px">';
    for(var h=0;h<24;h++){
      html+='<div class="tl-hour-line" style="left:'+(h*A_HOUR_W)+'px"></div>';
      if(h%2===0) html+='<div class="tl-hour-lab" style="left:'+(h*A_HOUR_W)+'px">'+pad(h)+':00</div>';
    }
    html+='<div class="tl-hour-line" style="left:'+(24*A_HOUR_W)+'px"></div>';
    for(var li=0;li<lanes.length;li++){
      html+='<div class="tl-lane-row" style="top:'+(A_TOP+li*A_LANE_H)+'px"></div>';
    }
    placed.forEach(function(p){
      var x=p.st/1440*W, w=(p.en-p.st)/1440*W;
      if(w<64) w=64;
      var y=A_TOP+p.lane*A_LANE_H+3;
      var done=!!p.t.completed[iso];
      html+='<div class="tl-task p-'+p.t.priority+(done?' done':'')+'" data-id="'+p.t.id+'" style="left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+(A_LANE_H-6)+'px">'
        +'<div class="t-top"><span class="t-time">'+esc(p.t.startTime)+(p.t.endTime?'–'+esc(p.t.endTime):'')+'</span>'
        +'<span class="t-ops">'
        +'<button class="mini chk'+(done?' on':'')+'" data-act="chk" aria-label="完成任务">'+ICONS.check+'</button>'
        +'<button class="mini del" data-act="del" aria-label="删除任务">'+ICONS.trash+'</button>'
        +'</span></div>'
        +'<div class="t-name">'+esc(p.t.title)+'</div>'
        +'<span class="tl-resize" title="拖动调整时长"></span>'
        +'</div>';
    });
    var now=new Date();
    var nowMin=now.getHours()*60+now.getMinutes();
    html+='<div class="tl-now-line" style="left:'+(nowMin/1440*W)+'px"><span>现在 '+pad(now.getHours())+':'+pad(now.getMinutes())+'</span></div>';
    html+='</div></div>';
    area.innerHTML=html;
    var sc=area.querySelector?area.querySelector('.tl-scroll'):null;
    if(sc) sc.scrollLeft=Math.max(0,nowMin/1440*W-sc.clientWidth/2);
  } else {
    html+='<div class="empty-tip">今天没有定时任务，可在上方任务列表添加（无时间任务显示在"全天"区）</div>';
    area.innerHTML=html;
  }
  bindDragA(area,W,iso);
};

var updateTimelineNow=function(now){
  var area=$('timelineArea');
  var line=area.querySelector?area.querySelector('.tl-now-line'):null;
  if(!line) return;
  var nowMin=now.getHours()*60+now.getMinutes();
  line.style.left=(nowMin/1440*(24*A_HOUR_W))+'px';
  var sp=line.querySelector?line.querySelector('span'):null;
  if(sp) sp.textContent='现在 '+pad(now.getHours())+':'+pad(now.getMinutes());
};

function bindDragA(area,W,iso){
  if(area._pd) area.removeEventListener('pointerdown',area._pd);
  if(area._ck) area.removeEventListener('click',area._ck);
  if(area._rzd) area.removeEventListener('pointerdown',area._rzd);
  var pd=function(e){
    var bar=e.target.closest('.tl-task');
    if(!bar) return;
    if(e.target.closest('.mini')) return;
    if(e.target.closest('.tl-resize')) return; // 时长调整交给 resize 处理
    if(e.preventDefault) e.preventDefault();
    var t=state.tasks.find(function(x){return x.id===bar.dataset.id;});
    if(!t) return;
    var drag={bar:bar,id:t.id,origStart:toMin(t.startTime)||0,origLane:(typeof t.laneIdx==='number')?t.laneIdx:0,
      startX:e.clientX,startY:e.clientY};
    bar.classList.add('dragging');
    drag.move=function(ev){
      var dx=(ev.clientX||0)-drag.startX, dy=(ev.clientY||0)-drag.startY;
      bar.style.left=(drag.origStart/1440*W+dx)+'px';
      bar.style.top=(A_TOP+drag.origLane*A_LANE_H+3+dy)+'px';
    };
    drag.up=function(ev){
      document.removeEventListener('pointermove',drag.move);
      document.removeEventListener('pointerup',drag.up);
      bar.classList.remove('dragging');
      var dx=(ev.clientX||0)-drag.startX, dy=(ev.clientY||0)-drag.startY;
      var tt=state.tasks.find(function(x){return x.id===drag.id;});
      if(!tt) return;
      var newMin=Math.round((drag.origStart+dx/A_HOUR_W*60)/15)*15;
      if(newMin<0)newMin=0; if(newMin>=1440)newMin=1439;
      var lane=Math.round((drag.origLane*A_LANE_H+dy)/A_LANE_H);
      if(lane<0)lane=0; if(lane>9)lane=9;
      var dur=taskDur(tt);
      tt.startTime=minToHM(newMin);
      if(tt.endTime) tt.endTime=minToHM(newMin+dur);
      tt.laneIdx=lane;
      saveTasks();
      render();
    };
    document.addEventListener('pointermove',drag.move);
    document.addEventListener('pointerup',drag.up);
  };
  // 时长调整：拖动矩形框右边缘把手
  var rzd=function(e){
    var handle=e.target.closest('.tl-resize');
    if(!handle) return;
    if(e.preventDefault) e.preventDefault();
    var bar=handle.closest('.tl-task');
    if(!bar) return;
    var t=state.tasks.find(function(x){return x.id===bar.dataset.id;});
    if(!t) return;
    var origStart=toMin(t.startTime)||0;
    var origDur=taskDur(t);
    var startX=e.clientX;
    bar.classList.add('resizing');
    var rz={bar:bar,origStart:origStart,origDur:origDur,startX:startX};
    rz.move=function(ev){
      var dx=(ev.clientX||0)-rz.startX;
      var newDur=Math.round((rz.origDur+dx/A_HOUR_W*60)/15)*15;
      if(newDur<15)newDur=15;
      if(rz.origStart+newDur>1440) newDur=1440-rz.origStart;
      rz.bar.style.width=(newDur/60*A_HOUR_W)+'px';
    };
    rz.up=function(ev){
      document.removeEventListener('pointermove',rz.move);
      document.removeEventListener('pointerup',rz.up);
      rz.bar.classList.remove('resizing');
      var dx=(ev.clientX||0)-rz.startX;
      var newDur=Math.round((rz.origDur+dx/A_HOUR_W*60)/15)*15;
      if(newDur<15)newDur=15;
      if(rz.origStart+newDur>1440) newDur=1440-rz.origStart;
      var tt=state.tasks.find(function(x){return x.id===rz.bar.dataset.id;});
      if(tt){
        if(tt.durationMin) tt.durationMin=newDur;
        tt.endTime=minToHM(rz.origStart+newDur);
        saveTasks();
        render();
      }
    };
    document.addEventListener('pointermove',rz.move);
    document.addEventListener('pointerup',rz.up);
  };
  var ck=function(e){
    var btn=e.target.closest('button[data-act]');
    if(!btn) return;
    var wrap=btn.closest('[data-id]');
    if(!wrap) return;
    var id=wrap.dataset.id;
    if(btn.dataset.act==='chk') toggleDone(id,iso);
    else if(btn.dataset.act==='del') askDelete(id);
  };
  area._pd=pd; area._ck=ck; area._rzd=rzd;
  area.addEventListener('pointerdown',pd);
  area.addEventListener('click',ck);
  area.addEventListener('pointerdown',rzd);
}

});
document.querySelectorAll('input[name="fixedMode"]').forEach(function(r){
  r.addEventListener('change',function(){ currentFixedMode=r.value; updateFieldVisibility(); });
});
$('fFreqAll').addEventListener('change',function(){
  var all=$('fFreqAll').checked;
  Array.prototype.forEach.call($('freqDays').children,function(b){
    b.disabled=all;
    if(all){ b.classList.remove('on'); b.setAttribute('aria-pressed','false'); }
  });
});
$('cancelBtn').addEventListener('click',closeTaskModal);
$('saveBtn').addEventListener('click',saveTaskFromForm);
$('cfCancel').addEventListener('click',confirmCancel);
$('cfOk').addEventListener('click',confirmOk);

[['taskModal',closeTaskModal],['confirmModal',confirmCancel]].forEach(function(pair){
  $(''+pair[0]).addEventListener('click',function(e){ if(e.target===$(''+pair[0])) pair[1](); });
});

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(!$('confirmModal').hidden){ confirmCancel(); }
    else if(!$('taskModal').hidden){ closeTaskModal(); }
    else if(!$('sideMask').hidden){ closeSide(); }
    else if($('viewDay').classList.contains('active')){ location.hash='#/calendar'; }
  }
});

/* ==================== 初始化 ==================== */
try {
  seedIfEmpty();
  state.tasks=loadTasks();
  state.notes=loadNotes();
  var now=new Date();
  state.year=now.getFullYear(); state.month=now.getMonth()+1;
  state.notesYear=now.getFullYear(); state.notesMonth=now.getMonth()+1;
  buildFreqChips();
  if(!location.hash) location.hash='#/calendar';
  render();
  setInterval(updateClock,1000);
  setTimeout(function(){ spawnDanmaku(rand(QUOTES.welcome),cssVar('--primary')); },600);
} catch(err) {
  var dbg=document.createElement('div');
  dbg.setAttribute('role','alert');
  dbg.style.cssText='position:fixed;left:0;right:0;top:0;z-index:9999;background:#A03028;color:#FFF8EC;padding:10px 16px;font-size:13px;line-height:1.6;font-family:serif;';
  dbg.textContent='页面初始化出错：'+(err&&err.message?err.message:String(err));
  document.body.appendChild(dbg);
  if(window.console&&console.error) console.error(err);
}

})();
</script>
</body>
</html>
